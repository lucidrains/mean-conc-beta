[project]
name = "mean-conc-beta"
version = "0.1.5"
description = "Beta distribution with mean / concentration parameterization, for bounded continuous action spaces in RL"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'reinforcement learning',
    'continuous control',
    'probability distribution'
]

classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "numpy",
    "torch>=2.5"
]

[project.urls]
Homepage = "https://pypi.org/project/mean-conc-beta/"
Repository = "https://github.com/lucidrains/mean-conc-beta"

[project.optional-dependencies]
test = [
    "gymnasium[mujoco]",
    "numpy",
    "pytest",
    "tqdm"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mean_conc_beta"]

[tool.hatch.build.targets.sdist]
include = [
    "mean_conc_beta",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
